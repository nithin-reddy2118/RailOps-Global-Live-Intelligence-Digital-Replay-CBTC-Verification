apiVersion: v1
kind: ConfigMap
metadata:
  name: cbtc-config
  namespace: cbtc-platform
data:
  RUST_LOG: "info"
  CBTC__DATABASE__URL: "postgres://cbtc:cbtc@postgres:5432/cbtc"
  CBTC__DATABASE__MAX_CONNECTIONS: "20"
  CBTC__REDIS__URL: "redis://redis:6379"
  CBTC__RABBITMQ__URL: "amqp://cbtc:cbtc@rabbitmq:5672/%2f"
  CBTC__RABBITMQ__EXCHANGE: "cbtc.events"
  CBTC__AUTH__JWT_TTL_SECS: "3600"
  CBTC__SERVER__HOST: "0.0.0.0"
  CBTC__SERVER__PORT: "8080"
  CBTC__FAULT_INJECTION__ENABLED: "false"
  MOVEMENT_AUTHORITY_SERVICE_URL: "http://movement-authority-service:8080"
  TRAIN_SERVICE_URL: "http://train-service:8080"
  AUTH_SERVICE_URL: "http://auth-service:8080"
  BLOCK_OCCUPANCY_SERVICE_URL: "http://block-occupancy-service:8080"
  INTERLOCKING_SERVICE_URL: "http://interlocking-service:8080"
  WAYSIDE_UNIT_SERVICE_URL: "http://wayside-unit-service:8080"
  PASSENGER_INFO_SERVICE_URL: "http://passenger-info-service:8080"
  MAINTENANCE_SERVICE_URL: "http://maintenance-service:8080"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8080"
  TELEMETRY_SERVICE_URL: "http://telemetry-service:8080"
  AUDIT_LOG_SERVICE_URL: "http://audit-log-service:8080"
  COMMS_GATEWAY_URL: "http://comms-gateway:8080"
  CENTRAL_CONTROL_SERVICE_URL: "http://central-control-service:8080"
  DASHBOARD_BACKEND_URL: "http://dashboard-backend:8080"
  GATEWAY_RATE_LIMIT_RPS: "200"
---
# Real deployments must supply this Secret's values via a proper
# secrets manager (Vault, Sealed Secrets, External Secrets Operator,
# or the cloud provider's KMS-backed secret store) — this manifest is
# the schema/contract every service expects, populated here with
# placeholder values ONLY suitable for a local kind/minikube demo.
apiVersion: v1
kind: Secret
metadata:
  name: cbtc-secrets
  namespace: cbtc-platform
type: Opaque
stringData:
  jwt-secret: "change-me-in-a-real-deployment-this-is-not-secure"
  interlocking-service-token: "replace-with-a-real-operator-role-jwt-minted-via-auth-service"
  central-control-service-token: "replace-with-a-real-admin-role-jwt-minted-via-auth-service"
