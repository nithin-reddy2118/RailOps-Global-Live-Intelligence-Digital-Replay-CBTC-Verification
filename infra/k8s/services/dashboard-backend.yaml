apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-backend
  namespace: cbtc-platform
  labels: { app: dashboard-backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: dashboard-backend }
  template:
    metadata:
      labels: { app: dashboard-backend }
    spec:
      containers:
        - name: dashboard-backend
          image: cbtc/dashboard-backend:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: cbtc-config }
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-backend
  namespace: cbtc-platform
spec:
  selector: { app: dashboard-backend }
  ports: [{ port: 8080, targetPort: 8080 }]
