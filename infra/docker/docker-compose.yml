name: cbtc-platform

x-service-defaults: &service-defaults
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile.service
  environment: &service-env
    RUST_LOG: info
    CBTC__DATABASE__URL: postgres://cbtc:cbtc@postgres:5432/cbtc
    CBTC__DATABASE__MAX_CONNECTIONS: "20"
    CBTC__REDIS__URL: redis://redis:6379
    CBTC__RABBITMQ__URL: amqp://cbtc:cbtc@rabbitmq:5672/%2f
    CBTC__RABBITMQ__EXCHANGE: cbtc.events
    CBTC__AUTH__JWT_SECRET: dev-only-secret-change-in-production
    CBTC__AUTH__JWT_TTL_SECS: "3600"
    CBTC__SERVER__HOST: 0.0.0.0
    CBTC__FAULT_INJECTION__ENABLED: "false"
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped
  networks: [cbtc-net]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cbtc
      POSTGRES_PASSWORD: cbtc
      POSTGRES_DB: cbtc
    ports: ["5433:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbtc -d cbtc"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [cbtc-net]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    networks: [cbtc-net]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: cbtc
      RABBITMQ_DEFAULT_PASS: cbtc
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [cbtc-net]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    networks: [cbtc-net]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
    networks: [cbtc-net]

  auth-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args: { SERVICE_NAME: auth-service }
    environment:
      <<: *service-env
      CBTC__SERVER__PORT: "8080"
    ports: ["8081:8080"]

  train-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args: { SERVICE_NAME: train-service }
    environment:
      <<: *service-env
      CBTC__SERVER__PORT: "8080"
    ports: ["8082:8080"]

  block-occupancy-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args: { SERVICE_NAME: block-occupancy-service }
    environment:
      <<: *service-env
      CBTC__SERVER__PORT: "8080"
    ports: ["8083:8080"]

  movement-authority-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args: { SERVICE_NAME: movement-authority-service }
    environment:
      <<: *service-env
      CBTC__SERVER__PORT: "8080"
    ports: ["8084:8080"]

  interlocking-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args: { SERVICE_NAME: interlocking-service }
    environment:
      <<: *service-env
      CBTC__SERVER__PORT: "8080"
      MOVEMENT_AUTHORITY_SERVICE_URL: http://movement-authority-service:8080
      INTERLOCKING_SERVICE_TOKEN: ${INTERLOCKING_SERVICE_TOKEN:?set via .env — see docs/openapi/README.md}
    ports: ["8085:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_started }
      movement-authority-service: { condition: service_started }

  wayside-unit-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args: { SERVICE_NAME: wayside-unit-service }
    environment:
      <<: *service-env
      CBTC__SERVER__PORT: "8080"
    ports: ["8086:8080"]

  passenger-info-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args: { SERVICE_NAME: passenger-info-service }
    environment:
      <<: *service-env
      CBTC__SERVER__PORT: "8080"
    ports: ["8087:8080"]

  maintenance-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args: { SERVICE_NAME: maintenance-service }
    environment:
      <<: *service-env
      CBTC__SERVER__PORT: "8080"
    ports: ["8088:8080"]

  notification-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args: { SERVICE_NAME: notification-service }
    environment:
      <<: *service-env
      CBTC__SERVER__PORT: "8080"
    ports: ["8089:8080"]

  telemetry-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args: { SERVICE_NAME: telemetry-service }
    environment:
      <<: *service-env
      CBTC__SERVER__PORT: "8080"
    ports: ["8090:8080"]

  audit-log-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args: { SERVICE_NAME: audit-log-service }
    environment:
      <<: *service-env
      CBTC__SERVER__PORT: "8080"
    ports: ["8091:8080"]

  comms-gateway:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args: { SERVICE_NAME: comms-gateway }
    environment:
      <<: *service-env
      CBTC__SERVER__PORT: "8080"
      TRAIN_SERVICE_URL: http://train-service:8080
    ports: ["8092:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_started }
      train-service: { condition: service_started }

  central-control-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args: { SERVICE_NAME: central-control-service }
    environment:
      <<: *service-env
      CBTC__SERVER__PORT: "8080"
      MOVEMENT_AUTHORITY_SERVICE_URL: http://movement-authority-service:8080
      CENTRAL_CONTROL_SERVICE_TOKEN: ${CENTRAL_CONTROL_SERVICE_TOKEN:?set via .env}
    ports: ["8093:8080"]

  dashboard-backend:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args: { SERVICE_NAME: dashboard-backend }
    environment:
      <<: *service-env
      CBTC__SERVER__PORT: "8080"
      CENTRAL_CONTROL_SERVICE_URL: http://central-control-service:8080
    ports: ["8094:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_started }
      central-control-service: { condition: service_started }

  api-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args: { SERVICE_NAME: api-gateway }
    environment:
      RUST_LOG: info
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      GATEWAY_RATE_LIMIT_RPS: "200"
      AUTH_SERVICE_URL: http://auth-service:8080
      TRAIN_SERVICE_URL: http://train-service:8080
      BLOCK_OCCUPANCY_SERVICE_URL: http://block-occupancy-service:8080
      MOVEMENT_AUTHORITY_SERVICE_URL: http://movement-authority-service:8080
      INTERLOCKING_SERVICE_URL: http://interlocking-service:8080
      WAYSIDE_UNIT_SERVICE_URL: http://wayside-unit-service:8080
      PASSENGER_INFO_SERVICE_URL: http://passenger-info-service:8080
      MAINTENANCE_SERVICE_URL: http://maintenance-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      TELEMETRY_SERVICE_URL: http://telemetry-service:8080
      AUDIT_LOG_SERVICE_URL: http://audit-log-service:8080
      COMMS_GATEWAY_URL: http://comms-gateway:8080
      CENTRAL_CONTROL_SERVICE_URL: http://central-control-service:8080
      DASHBOARD_BACKEND_URL: http://dashboard-backend:8080
    ports: ["8080:8080"]
    depends_on:
      - auth-service
      - train-service
      - block-occupancy-service
      - movement-authority-service
      - interlocking-service
    restart: unless-stopped
    networks: [cbtc-net]

  dashboard-frontend:
    build:
      context: ../../dashboard-frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_WS_URL: ws://localhost:8080/dashboard/ws
    ports: ["5173:80"]
    depends_on: [api-gateway]
    networks: [cbtc-net]

volumes:
  postgres-data:
  grafana-data:

networks:
  cbtc-net:
    driver: bridge
