[package]
name = "dashboard-backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "dashboard_backend"
path = "src/lib.rs"

[[bin]]
name = "dashboard-backend"
path = "src/main.rs"

[dependencies]
cbtc-domain = { workspace = true }
cbtc-errors = { workspace = true }
cbtc-db = { workspace = true }
cbtc-ptdf = { workspace = true }
cbtc-events = { workspace = true }
cbtc-auth = { workspace = true }
cbtc-observability = { workspace = true }
cbtc-mq = { workspace = true }
cbtc-config = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5"] }
chrono = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
sqlx = { workspace = true }
async-trait = "0.1.89"
gtfs-rt = "0.5.0"
prost = "0.11.9"
csv = "1.3.1"
